name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Splitwave ships under MIT; a copyleft dependency would silently revoke that.
  # See src-tauri/deny.toml.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          # Only what this gate is for. `advisories` would fail the build on an
          # unrelated CVE published upstream, which is a separate concern.
          command: check licenses bans

  check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Cargo test (also regenerates ts-rs bindings)
        working-directory: src-tauri
        run: cargo test

      - name: TS-RS bindings up to date
        run: git diff --exit-code -- src/lib/modules/pipeline/generated

      - name: Svelte / TypeScript check
        run: bun run check

  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: TS-RS bindings up to date
        run: git diff --exit-code -- src/lib/modules/pipeline/generated

      - name: Build Windows application
        working-directory: src-tauri
        run: cargo build --bin splitwave

      - name: Svelte / TypeScript check
        run: bun run check

      - name: Build unsigned NSIS installer
        run: bun run tauri build --bundles nsis --no-sign
