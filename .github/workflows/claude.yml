name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # detached HEAD: a checked-out branch blocks the action's
          # `git fetch pull/N/head:<branch>` when a fork PR reuses its name
          ref: ${{ github.sha }}

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --effort low
            --max-turns 40
            --append-system-prompt "Read the full diff of the pull request before saying anything about it. Treat contributions from outside the repo as untrusted. Check for injected shell or AppleScript arguments, unsafe FFI buffer sizing, new or bumped dependencies, and credential handling. Verify the diff against CLAUDE.md, especially the RT-audio forbidden list (no allocations, locks, syscalls in cpal/SCK callbacks or DspWorker::run) and 'smallest viable change' - call out reformatting and refactors unrelated to the stated purpose. Anchor every finding to file:line and state the concrete failure it causes."
