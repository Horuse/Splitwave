<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Microphone Array signal flow and clock domains</title>
  <desc id="desc">Four channels from one master audio interface remain separate and bypass ASRC. Two independent USB microphone slave domains each use one ASRC. Six synchronized channels are calibrated, steered, spatially combined into one mono stream, then sent to separate downstream effects.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#263244" stroke-width="1" opacity="0.42"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Segoe UI, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Inter, Segoe UI, sans-serif; fill: #94a3b8; }
      .heading { font: 700 18px Inter, Segoe UI, sans-serif; fill: #f8fafc; letter-spacing: .04em; }
      .label { font: 600 15px Inter, Segoe UI, sans-serif; fill: #e2e8f0; }
      .small { font: 400 13px Inter, Segoe UI, sans-serif; fill: #a8b3c4; }
      .tiny { font: 600 12px Inter, Segoe UI, sans-serif; fill: #cbd5e1; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0b111a"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <text x="52" y="60" class="title">From physical microphones to one Spatial Voice stream</text>
  <text x="52" y="90" class="subtitle">N is the channel count. K is the independent capture clock-domain count. One device is one domain.</text>

  <text x="52" y="137" class="heading">PHYSICAL INPUTS</text>
  <text x="475" y="137" class="heading">CLOCK ALIGNMENT</text>
  <text x="842" y="137" class="heading">CALIBRATION + SPATIAL DSP</text>
  <text x="1284" y="137" class="heading">GRAPH</text>

  <rect x="35" y="155" width="385" height="685" rx="22" fill="#0d1723" stroke="#334155" stroke-width="2"/>
  <rect x="448" y="155" width="765" height="685" rx="22" fill="#111126" fill-opacity=".9" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="472" y="818" class="small" fill="#c4b5fd">MICROPHONE ARRAY INPUT NODE</text>
  <rect x="1240" y="155" width="325" height="685" rx="22" fill="#0c1c18" stroke="#10b981" stroke-width="2" stroke-dasharray="9 7"/>

  <!-- Master physical device -->
  <rect x="58" y="182" width="338" height="300" rx="18" fill="#0c2230" stroke="#22d3ee" stroke-width="2"/>
  <rect x="76" y="200" width="302" height="44" rx="12" fill="#12354a"/>
  <text x="92" y="228" class="heading" fill="#67e8f9">DEVICE A · CLOCK DOMAIN 1</text>
  <text x="78" y="272" class="label">4-channel audio interface</text>
  <text x="78" y="295" class="small">MASTER · N=4 · K contribution=1</text>
  <g>
    <circle cx="96" cy="334" r="9" fill="#22d3ee"/><text x="118" y="339" class="mono">channel 1</text>
    <circle cx="96" cy="372" r="9" fill="#38bdf8"/><text x="118" y="377" class="mono">channel 2</text>
    <circle cx="96" cy="410" r="9" fill="#818cf8"/><text x="118" y="415" class="mono">channel 3</text>
    <circle cx="96" cy="448" r="9" fill="#c084fc"/><text x="118" y="453" class="mono">channel 4</text>
  </g>
  <path d="M250 334 H455 M250 372 H455 M250 410 H455 M250 448 H455" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>

  <!-- Slave devices -->
  <rect x="58" y="510" width="338" height="125" rx="18" fill="#2a1d0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="78" y="540" class="heading" fill="#fbbf24">DEVICE B · CLOCK DOMAIN 2</text>
  <text x="78" y="568" class="label">USB microphone · 1 channel</text>
  <text x="78" y="594" class="small">SLAVE · independent hardware clock</text>
  <path d="M300 576 H455" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="58" y="663" width="338" height="125" rx="18" fill="#2a1d0b" stroke="#fb923c" stroke-width="2"/>
  <text x="78" y="693" class="heading" fill="#fdba74">DEVICE C · CLOCK DOMAIN 3</text>
  <text x="78" y="721" class="label">USB microphone · 1 channel</text>
  <text x="78" y="747" class="small">SLAVE · independent hardware clock</text>
  <path d="M300 729 H455" fill="none" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Domain alignment -->
  <rect x="472" y="182" width="300" height="300" rx="18" fill="#101f2a" stroke="#38bdf8" stroke-width="2"/>
  <text x="492" y="214" class="heading" fill="#67e8f9">MASTER DOMAIN</text>
  <text x="492" y="242" class="small">sets worker cadence and time reference</text>
  <rect x="492" y="268" width="260" height="146" rx="14" fill="#0d2a38" stroke="#22d3ee"/>
  <text x="512" y="297" class="label">4 channels pass through separately</text>
  <path d="M512 328 H724 M512 350 H724 M512 372 H724 M512 394 H724" stroke="#38bdf8" stroke-width="3"/>
  <text x="512" y="442" class="tiny">NO ASRC · NO MIXING · PHASE PRESERVED</text>

  <rect x="472" y="510" width="300" height="125" rx="18" fill="#2a1d0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="492" y="541" class="heading" fill="#fbbf24">ONE ASRC FOR DOMAIN 2</text>
  <path d="M500 574 C530 548 560 600 590 574 S650 548 680 574 S720 600 744 574" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <text x="492" y="614" class="small">occupancy-driven ratio · one shared timing model</text>

  <rect x="472" y="663" width="300" height="125" rx="18" fill="#2a1d0b" stroke="#fb923c" stroke-width="2"/>
  <text x="492" y="694" class="heading" fill="#fdba74">ONE ASRC FOR DOMAIN 3</text>
  <path d="M500 727 C530 701 560 753 590 727 S650 701 680 727 S720 753 744 727" fill="none" stroke="#fb923c" stroke-width="4"/>
  <text x="492" y="767" class="small">occupancy-driven ratio · one shared timing model</text>

  <path d="M622 482 V495 H806 V512" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M622 482 V648 H806 V674" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="650" y="501" class="tiny">timing reference</text>

  <!-- Six-channel handoff -->
  <path d="M772 336 H827 M772 573 H805 V380 H827 M772 726 H815 V424 H827" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="827" y="182" width="175" height="300" rx="18" fill="#22173a" stroke="#a78bfa" stroke-width="2"/>
  <text x="847" y="214" class="heading" fill="#c4b5fd">SYNCHRONIZED</text>
  <text x="847" y="238" class="heading" fill="#c4b5fd">PLANAR BUFFER</text>
  <text x="847" y="275" class="label">N=6 channels</text>
  <text x="847" y="300" class="small">K=3 clock domains</text>
  <g stroke-width="4">
    <path d="M850 331 H977" stroke="#22d3ee"/><path d="M850 354 H977" stroke="#38bdf8"/>
    <path d="M850 377 H977" stroke="#818cf8"/><path d="M850 400 H977" stroke="#c084fc"/>
    <path d="M850 423 H977" stroke="#f59e0b"/><path d="M850 446 H977" stroke="#fb923c"/>
  </g>
  <text x="847" y="469" class="tiny">6 CHANNELS RETAINED</text>

  <rect x="827" y="510" width="175" height="278" rx="18" fill="#22173a" stroke="#a78bfa" stroke-width="2"/>
  <text x="847" y="542" class="heading" fill="#c4b5fd">PER MEMBER</text>
  <text x="847" y="576" class="label">fixed delay</text>
  <text x="847" y="606" class="label">gain</text>
  <text x="847" y="636" class="label">polarity</text>
  <text x="847" y="666" class="label">weight / health</text>
  <line x1="847" y1="688" x2="980" y2="688" stroke="#6d5aa8"/>
  <text x="847" y="716" class="small">from 3 s calibration</text>
  <text x="847" y="742" class="small">fingerprinted to topology,</text>
  <text x="847" y="763" class="small">format, geometry and target</text>

  <path d="M914 482 V500" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1002 648 H1022" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1022" y="182" width="165" height="606" rx="18" fill="#251642" stroke="#a78bfa" stroke-width="2"/>
  <text x="1042" y="214" class="heading" fill="#c4b5fd">STEERING</text>
  <text x="1042" y="242" class="small">geometry + fixed target</text>
  <rect x="1042" y="270" width="125" height="88" rx="12" fill="#311d54"/>
  <text x="1061" y="304" class="label">direction</text>
  <text x="1061" y="330" class="small">far field</text>
  <text x="1092" y="382" class="small">or</text>
  <rect x="1042" y="401" width="125" height="88" rx="12" fill="#311d54"/>
  <text x="1061" y="435" class="label">point</text>
  <text x="1061" y="461" class="small">near field</text>
  <line x1="1042" y1="516" x2="1167" y2="516" stroke="#6d5aa8"/>
  <text x="1042" y="548" class="heading" fill="#c4b5fd">BEAMFORMER</text>
  <text x="1042" y="582" class="label">Delay-and-Sum</text>
  <text x="1042" y="612" class="label">GSC</text>
  <text x="1042" y="642" class="label">MVDR</text>
  <text x="1042" y="681" class="small">align target delays</text>
  <text x="1042" y="704" class="small">combine N → 1</text>
  <circle cx="1104" cy="748" r="24" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
  <text x="1095" y="756" class="heading">Σ</text>

  <!-- Mono graph chain -->
  <path d="M1187 748 H1225 V234 H1260" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1270" y="188" width="265" height="92" rx="16" fill="#073c2e" stroke="#34d399" stroke-width="2"/>
  <text x="1291" y="224" class="heading" fill="#6ee7b7">SPATIAL VOICE</text>
  <text x="1291" y="253" class="label">one mono graph output</text>
  <path d="M1402 280 V320" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1270" y="330" width="265" height="82" rx="14" fill="#0b2e25" stroke="#10b981"/>
  <text x="1291" y="379" class="heading">NOISE SUPPRESSOR</text>
  <path d="M1402 412 V445" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1270" y="455" width="265" height="82" rx="14" fill="#0b2e25" stroke="#10b981"/>
  <text x="1291" y="504" class="heading">COMPRESSOR</text>
  <path d="M1402 537 V570" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1270" y="580" width="265" height="82" rx="14" fill="#0b2e25" stroke="#10b981"/>
  <text x="1291" y="629" class="heading">EQ</text>
  <path d="M1402 662 V695" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1270" y="705" width="265" height="82" rx="14" fill="#0b2e25" stroke="#10b981"/>
  <text x="1291" y="754" class="heading">OUTPUT / RECORDER</text>

  <text x="52" y="875" class="subtitle">Example: one 4-channel interface + two USB microphones gives N=6 and K=3. Only the two slave domains are resampled.</text>
</svg>
