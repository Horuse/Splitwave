id: app.splitwave.Splitwave

runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: splitwave

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # cpal/ALSA devices and the PipeWire graph (system + per-app capture)
  - --filesystem=xdg-run/pipewire-0
  - --device=all
  # sink definitions survive a PipeWire restart only if the drop-in lands on
  # the host config, which the sandbox private config dir does not reach
  - --filesystem=xdg-config/pipewire/pipewire.conf.d:create
  # recording targets and WAV sources the user picks through the dialog
  - --filesystem=xdg-music
  - --filesystem=xdg-documents
  # updater endpoint, WebRTC/websocket transports
  - --share=network

# prebuilt tauri binary, and eu-strip is absent on the CI runner
no-debuginfo: true
strip: false

modules:
  - name: splitwave
    buildsystem: simple
    build-commands:
      - mkdir -p deb-extract
      - ar -x splitwave.deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.gz
      - install -Dm755 deb-extract/usr/bin/splitwave /app/bin/splitwave
      # tauri leaves Categories empty, which appstream rejects
      - sed -i -e 's/^Icon=.*/Icon=app.splitwave.Splitwave/' -e 's/^Categories=.*/Categories=AudioVideo;Audio;/' deb-extract/usr/share/applications/Splitwave.desktop
      - install -Dm644 deb-extract/usr/share/applications/Splitwave.desktop /app/share/applications/app.splitwave.Splitwave.desktop
      - |
        set -e
        for png in deb-extract/usr/share/icons/hicolor/*/apps/*.png; do
          dir=$(basename $(dirname $(dirname "$png")))
          install -Dm644 "$png" "/app/share/icons/hicolor/$dir/apps/app.splitwave.Splitwave.png"
        done
      - install -Dm644 app.splitwave.Splitwave.metainfo.xml /app/share/metainfo/app.splitwave.Splitwave.metainfo.xml
      - install -Dm644 LICENSE -t /app/share/licenses/app.splitwave.Splitwave
    sources:
      - type: file
        path: app.splitwave.Splitwave.metainfo.xml
      - type: file
        path: splitwave.deb
      - type: file
        path: ../LICENSE
