id: com.horuse.splitwave

runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk

command: splitwave

finish-args:
    - --socket=wayland
    - --socket=fallback-x11
    - --share=ipc
    - --device=dri
    # cpal/ALSA devices and the PipeWire graph (system + per-app capture)
    - --socket=pipewire
    - --device=all
    # recording targets and WAV sources the user picks through the dialog
    - --filesystem=xdg-music
    - --filesystem=xdg-documents
    # updater endpoint, WebRTC/websocket transports
    - --share=network

modules:
    - name: splitwave
      buildsystem: simple
      sources:
          - type: file
            path: com.horuse.splitwave.metainfo.xml
          - type: file
            path: splitwave.deb
      build-commands:
          - mkdir -p deb-extract
          - ar -x splitwave.deb --output deb-extract
          - tar -C deb-extract -xf deb-extract/data.tar.gz
          - install -Dm755 deb-extract/usr/bin/splitwave /app/bin/splitwave
          - sed -i 's/^Icon=.*/Icon=com.horuse.splitwave/' deb-extract/usr/share/applications/Splitwave.desktop
          - install -Dm644 deb-extract/usr/share/applications/Splitwave.desktop /app/share/applications/com.horuse.splitwave.desktop
          - |
            set -e
            for png in deb-extract/usr/share/icons/hicolor/*/apps/*.png; do
              dir=$(basename $(dirname $(dirname "$png")))
              install -Dm644 "$png" "/app/share/icons/hicolor/$dir/apps/com.horuse.splitwave.png"
            done
          - install -Dm644 com.horuse.splitwave.metainfo.xml /app/share/metainfo/com.horuse.splitwave.metainfo.xml
